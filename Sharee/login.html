<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Sharee</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="logo">SHAREE</h1>
            <p class="subtitulo">Red social educativa</p>

            <form id="formularioLogin" class="formulario">
                <div class="grupo-formulario">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" placeholder="tu_email@escuelasproa.edu.ar" required>
                    <span class="error-mensaje" id="error-email"></span>
                </div>

                <div class="grupo-formulario">
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
                    <span class="error-mensaje" id="error-password"></span>
                </div>

                <div id="mensajeGeneral" class="mensaje-general"></div>

                <button type="submit" class="boton-login">Iniciar sesión</button>
            </form>

            <p class="link-registro">
                ¿No tenés una cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
