<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sharee</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>
    <main class="registro-container">
        <div class="registro-box">
            <h1 class="logo">SHAREE</h1>
            <p class="subtitulo">Únete a la comunidad educativa</p>

            <form id="formularioRegistro" class="formulario" novalidate>
                <div id="camposRegistro">
                    <div class="grupo-formulario">
                        <label for="nombre">Nombre *</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                        <span class="error-mensaje" id="error-nombre"></span>
                    </div>

                    <div class="grupo-formulario">
                        <label for="apellido">Apellido *</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
                        <span class="error-mensaje" id="error-apellido"></span>
                    </div>

                    <div class="grupo-formulario">
                        <label for="username">Nombre de usuario *</label>
                        <input type="text" id="username" name="username" placeholder="usuario_123" required>
                        <span class="error-mensaje" id="error-username"></span>
                    </div>

                    <div class="grupo-formulario">
                        <label for="email">Email institucional *</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="tu_email@escuelasproa.edu.ar"
                            required>
                        <span class="error-mensaje" id="error-email"></span>
                    </div>

                    <div class="grupo-formulario">
                        <label for="password">Contraseña *</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Mínimo 6 caracteres"
                            required>
                        <span class="error-mensaje" id="error-password"></span>
                    </div>

                    <div class="grupo-formulario">
                        <label for="passwordConfirm">Confirmar contraseña *</label>
                        <input
                            type="password"
                            id="passwordConfirm"
                            name="passwordConfirm"
                            placeholder="Repite tu contraseña"
                            required>
                        <span class="error-mensaje" id="error-passwordConfirm"></span>
                    </div>

                    <button type="submit" class="boton-registro" id="botonRegistro">
                        Registrarse
                    </button>
                </div>
            </form>

            <section id="panelVerificacion" class="panel-verificacion oculto" aria-live="polite">
                <p class="texto-verificacion">
                    Enviamos un código de seis dígitos a
                    <strong id="correoVerificacion"></strong>.
                    Ingrésalo para completar tu registro.
                </p>

                <div class="formulario">
                    <div class="grupo-formulario">
                        <label for="codigo">Código de verificación</label>
                        <input
                            type="text"
                            id="codigo"
                            name="codigo"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            pattern="[0-9]{6}"
                            maxlength="6"
                            placeholder="000000"
                            aria-describedby="ayudaCodigo"
                            required>

                        <small id="ayudaCodigo" class="ayuda-codigo">
                            El código vence en <span id="temporizador">05:00</span>.
                        </small>
                    </div>

                    <div id="mensajeCodigo" class="mensaje-general" role="status"></div>

                    <button type="button" class="boton-registro" id="botonVerificar">
                        Verificar código
                    </button>

                    <button type="button" class="boton-reenviar" id="botonReenviar" disabled>
                        Reenviar código
                    </button>
                </div>
            </section>

            <div id="mensajeGeneral" class="mensaje-general" role="status"></div>

            <p class="link-login">
                ¿Ya tenés una cuenta? <a href="login.html">Inicia sesión</a>
            </p>
        </div>
    </main>

    <button
        class="dark-mode-button"
        type="button"
        data-dark-mode-toggle
        aria-label="Cambiar a modo oscuro">
        🌙
    </button>

    <!-- El parámetro v obliga al navegador a cargar este archivo actualizado. -->
    <script src="js/registro.js?v=20261117-2"></script>
    <script src="js/darkmode.js"></script>
</body>
</html>
