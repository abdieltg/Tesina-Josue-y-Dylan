<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sharee</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>
    <div class="registro-container">
        <div class="registro-box">
            <h1 class="logo">SHAREE</h1>
            <p class="subtitulo">Únete a la comunidad educativa</p>
            
            <form id="formularioRegistro" class="formulario">
                <div class="grupo-formulario">
                    <label for="nombre">Nombre *</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    <span class="error-mensaje" id="error-nombre"></span>
                </div>

                <div class="grupo-formulario">
                    <label for="apellido">Apellido *</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
                    <span class="error-mensaje" id="error-apellido"></span>
                </div>

                <div class="grupo-formulario">
                    <label for="username">Nombre de usuario *</label>
                    <input type="text" id="username" name="username" placeholder="usuario_123" required>
                    <span class="error-mensaje" id="error-username"></span>
                </div>

                <div class="grupo-formulario">
                    <label for="email">Email institucional *</label>
                    <input type="email" id="email" name="email" placeholder="tu_email@escuelasproa.edu.ar" required>
                    <span class="error-mensaje" id="error-email"></span>
                </div>

                <div class="grupo-formulario">
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
                    <span class="error-mensaje" id="error-password"></span>
                </div>

                <div class="grupo-formulario">
                    <label for="passwordConfirm">Confirmar contraseña *</label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="Repite tu contraseña" required>
                    <span class="error-mensaje" id="error-passwordConfirm"></span>
                </div>

                <div id="mensajeGeneral" class="mensaje-general"></div>

                <button type="submit" class="boton-registro">Registrarse</button>
            </form>

            <p class="link-login">
                ¿Ya tenés una cuenta? <a href="login.html">Inicia sesión</a>
            </p>
        </div>
    </div>

    <script src="js/registro.js"></script>
</body>
</html>
